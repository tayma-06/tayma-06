name: Generate Snake

on:
  schedule:
    - cron: "30 0 * * *" # 06:30 AM Bangladesh time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Violet Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23A855F7&color_dots=%23F8FAFC,%23E9D5FF,%23C084FC,%23A855F7,%23EC4899
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23F0ABFC&color_dots=%23090014,%233B0764,%237E22CE,%23C026D3,%23F472B6

      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
